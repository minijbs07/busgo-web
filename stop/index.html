<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0878f9">
  <meta name="apple-itunes-app" content="app-id=6753916938, app-clip-bundle-id=com.javi.TUSApp.Clip">
  <title>Próximas llegadas · BusGo</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #eef7ff, #d7eaff); color: #10213a; }
    main { width: min(35rem, calc(100% - 2rem)); padding: 1rem; }
    .card { padding: 2rem; border-radius: 2rem; background: rgba(255,255,255,.86); box-shadow: 0 1.5rem 4rem rgba(12,73,141,.16); backdrop-filter: blur(24px); }
    .eyebrow { color: #0878f9; font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: .45rem 0 .7rem; font-size: clamp(2rem, 10vw, 3.4rem); letter-spacing: -.04em; }
    p { color: #50647d; font-size: 1.05rem; line-height: 1.5; }
    .actions { display: grid; gap: .65rem; margin-top: 1.4rem; }
    a { padding: .9rem 1.1rem; border-radius: 999px; text-align: center; text-decoration: none; font-weight: 750; }
    .primary { background: #0878f9; color: white; }
    .secondary { color: #0878f9; background: #e8f3ff; }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(160deg, #07192e, #0b315d); color: white; }
      .card { background: rgba(15,31,51,.88); }
      p { color: #b6c7da; }
      .secondary { background: #123f70; color: #75b9ff; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="eyebrow">BusGo Instantáneo</div>
      <h1 id="title">Tu parada</h1>
      <p>Abre el App Clip para ver llegadas en directo, ubicación y líneas sin instalar la aplicación completa.</p>
      <div class="actions">
        <a class="primary" id="open" href="https://javib.es/busgo-web/stop">Abrir llegadas</a>
        <a class="secondary" href="https://apps.apple.com/es/app/busgo/id6753916938">Descargar BusGo</a>
      </div>
    </section>
  </main>
  <script>
    const stop = new URLSearchParams(location.search).get('p');
    if (/^\d{1,8}$/.test(stop || '')) {
      document.querySelector('#title').textContent = `Parada ${Number(stop)}`;
      document.querySelector('#open').href = `https://javib.es/busgo-web/stop?p=${Number(stop)}`;
    }
  </script>
</body>
</html>
